    <script>
        const audio = document.getElementById('radioPlayer');
        // Pones tu enlace .m3u8 exacto dentro de las comillas
        const streamUrl = 'https://66.41.e38.ac.34.ca.1936/RadioPorcuna/stream.m3u8';

        if (Hls.isSupported()) {
            const hls = new Hls();
            hls.loadSource(streamUrl);
