<div style="max-width: 320px; background: #1a1a1a; color: #fff; padding: 15px; border-radius: 12px; font-family: sans-serif; box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: center;">
    <!-- Título de la emisora -->
    <div style="font-size: 15px; font-weight: bold; margin-bottom: 10px; color: #ffcc00;">Radio Porcuna en Directo</div>
    
    <!-- Título de la canción en tiempo real -->
    <div id="shoutcast-song" style="font-size: 13px; color: #00ffcc; margin-bottom: 12px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
        Conectando con el servidor...
    </div>

    <!-- Reproductor de audio HTML5 seguro -->
    <audio controls style="width: 100%;">
        <source src="https://radioporcuna.canalretrohits.online/stream" type="audio/mpeg">
        Tu navegador no soporta el elemento de audio.
    </audio>
</div>

<!-- Script directo optimizado -->
<script>
    function updateSongTitle() {
        fetch('https://radioporcuna.canalretrohits.online/stats?json=1')
            .then(response => response.json())
            .then(data => {
                if (data && data.songtitle) {
                    document.getElementById('shoutcast-song').innerText = data.songtitle;
                }
            })
            .catch(error => {
                document.getElementById('shoutcast-song').innerText = "Radio Porcuna Directo";
            });
    }
    setInterval(updateSongTitle, 5000);
    updateSongTitle();
</script>
